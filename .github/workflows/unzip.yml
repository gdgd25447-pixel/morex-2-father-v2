name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Project File from Google Drive
        run: |
          FILE_ID="165nBZF28et3iTZjBWk8DP3-U1TiZr6wL"
          curl -L -c cookies.txt "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o project.zip
          
          # Verification
          if [ $(stat -c%s "project.zip") -lt 1000000 ]; then
            echo "Confirming large file download from Drive..."
            CONFIRM=$(grep -o 'confirm=[^&]*' cookies.txt | cut -d'=' -f2)
            curl -L -b cookies.txt "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o project.zip
          fi

      - name: Extract Project Zip
        run: |
          mkdir -p extracted_project
          unzip -q project.zip -d extracted_project
          
          # Find directory containing settings.gradle / build.gradle
          ROOT_DIR=$(find extracted_project -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          
          if [ -n "$ROOT_DIR" ]; then
            echo "Found project root at: $ROOT_DIR"
            cp -r $ROOT_DIR/* .
          else
            echo "Copying all extracted files to workspace..."
            cp -r extracted_project/* .
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
