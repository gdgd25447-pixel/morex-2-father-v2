name: Download and Extract Father ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP from Google Drive
        run: |
          echo "📥 Downloading ZIP from Google Drive..."
          FILE_ID="165nBZF28et3iTZjBWk8DP3-U1TiZr6wL"
          curl -L -c /tmp/cookies.txt \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o morex-2-father-final.zip
          ls -lh morex-2-father-final.zip

      - name: Extract ZIP
        run: |
          echo "📦 Extracting..."
          unzip -o morex-2-father-final.zip
          rm -f morex-2-father-final.zip
          echo "📂 Extracted files:"
          ls -la

      - name: Commit files
        run: |
          git config user.name "MOREX Bot"
          git config user.email "bot@morex.app"
          git add .
          git commit -m "Auto-extract father ZIP" || echo "No changes to commit"
          git push
