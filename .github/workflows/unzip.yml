name: Extract Father ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP from Release
        run: |
          echo "📥 Downloading ZIP..."
          curl -L -o father.zip \
            "https://github.com/gdgd25447-pixel/morex-2-father-v2/releases/download/v1.0/morex-2-father-final-7.zip"
          ls -lh father.zip
          file father.zip

      - name: Verify it's a real ZIP
        run: |
          if ! unzip -t father.zip > /dev/null 2>&1; then
            echo "❌ ERROR: Downloaded file is not a valid ZIP"
            file father.zip
            head -c 500 father.zip
            exit 1
          fi
          echo "✅ Valid ZIP confirmed"

      - name: Extract ZIP
        run: |
          echo "📦 Extracting..."
          unzip -o father.zip
          rm -f father.zip
          echo "📂 Extracted files:"
          ls -la

      - name: Commit files
        run: |
          git config user.name "MOREX Bot"
          git config user.email "bot@morex.app"
          git add .
          git commit -m "Auto-extract father ZIP" || echo "No changes"
          git push
