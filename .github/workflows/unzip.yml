name: Extract Father ZIP (With Repair)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          curl -L -o father.zip \
            "https://github.com/gdgd25447-pixel/morex-2-father-v2/releases/download/v1.0/morex-2-father-final-7.zip"
          ls -lh father.zip

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Try normal extraction
        run: |
          echo "🔧 Attempt 1: 7z normal..."
          7z x father.zip -y -bd || true
          echo "📂 After 7z:"
          ls -la | head -20

      - name: Try repair if needed
        run: |
          if [ ! -d "morex-2-father" ] && [ ! -f "build.gradle" ]; then
            echo "🔧 Attempt 2: unzip -FF (Frankenstein repair)..."
            unzip -FF father.zip -d extracted/ || true
            echo "🔧 Attempt 3: 7z with force..."
            7z x father.zip -y -bd -bso0 -bsp0 || true
          fi
          echo "📂 Final result:"
          ls -la

      - name: Move files to root
        run: |
          shopt -s dotglob
          if [ -d "morex-2-father" ]; then
            mv morex-2-father/* . 2>/dev/null || true
            rmdir morex-2-father 2>/dev/null || true
          fi
          if [ -d "extracted" ]; then
            if [ -d "extracted/morex-2-father" ]; then
              mv extracted/morex-2-father/* . 2>/dev/null || true
            fi
          fi
          rm -rf extracted father.zip
          echo "📂 After move:"
          ls -la

      - name: Commit files
        run: |
          git config user.name "MOREX Bot"
          git config user.email "bot@morex.app"
          git add .
          git commit -m "Auto-extract father files" || echo "No changes"
          git push
