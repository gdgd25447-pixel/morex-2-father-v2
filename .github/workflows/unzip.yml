name: Extract Father ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          echo "📥 Downloading..."
          curl -L -o father.zip \
            "https://github.com/gdgd25447-pixel/morex-2-father-v2/releases/download/v1.0/morex-2-father-final-7.zip"
          echo "📊 Size:"
          ls -lh father.zip
          echo "📋 Type:"
          file father.zip

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Extract with 7z (handles all ZIP variants)
        run: |
          echo "📦 Extracting with 7z..."
          7z x father.zip -y
          echo "🗑️ Cleaning up..."
          rm -f father.zip
          echo "📂 Result:"
          ls -la

      - name: Move files to root if inside subfolder
        run: |
          if [ -d "morex-2-father" ]; then
            echo "📁 Moving files from morex-2-father/ to root..."
            shopt -s dotglob
            mv morex-2-father/* .
            rmdir morex-2-father
            echo "📂 After move:"
            ls -la
          else
            echo "✅ Files already at root"
          fi

      - name: Commit files
        run: |
          git config user.name "MOREX Bot"
          git config user.email "bot@morex.app"
          git add .
          git commit -m "Auto-extract father files" || echo "No changes"
          git push
