name: Setup Gradle Wrapper and Settings

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Show current structure
        run: |
          echo "=== BEFORE ==="
          ls -la
          echo ""
          echo "=== gradle/wrapper ==="
          ls -la gradle/wrapper/ || echo "missing"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Delete duplicate folder
        run: |
          if [ -d "morex-2-father" ]; then
            rm -rf morex-2-father
            echo "✅ Deleted duplicate folder morex-2-father/"
          else
            echo "ℹ️ morex-2-father/ not found"
          fi

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MOREX-Father"
          include ':app'
          EOF
          echo "✅ Created settings.gradle:"
          cat settings.gradle

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          echo "✅ Wrapper generated:"
          ls -la gradlew gradlew.bat gradle/wrapper/

      - name: Grant execute
        run: chmod +x gradlew

      - name: Verify everything
        run: |
          echo "=== AFTER ==="
          ls -la
          echo ""
          echo "=== Required files check ==="
          for f in app build.gradle settings.gradle gradlew gradlew.bat gradle.properties gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ -e "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MISSING"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "MOREX Bot"
          git config user.email "bot@morex.local"
          git add -A
          git status
          git commit -m "fix: setup gradle wrapper, settings.gradle, remove duplicate folder" || echo "no changes"
          git push
