name: Build MOREX Father APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Verify required files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          FAILED=0
          [ -d app ]            || { echo "❌ app/ missing";            FAILED=1; }
          [ -f build.gradle ]   || { echo "❌ build.gradle missing";    FAILED=1; }
          [ -f settings.gradle ]|| { echo "❌ settings.gradle missing"; FAILED=1; }
          [ -f gradlew ]        || { echo "❌ gradlew missing";         FAILED=1; }
          [ -f app/build.gradle ]|| { echo "❌ app/build.gradle missing";FAILED=1; }
          if [ $FAILED -eq 1 ]; then exit 1; fi
          echo "✅ كل الملفات موجودة"

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Verify Java + Android SDK (pre-installed)
        run: |
          java -version
          echo ""
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo "=== SDK contents ==="
          ls -la $ANDROID_HOME || echo "no SDK"
          echo ""
          echo "=== platforms ==="
          ls $ANDROID_HOME/platforms || echo "no platforms"

      - name: 5. Decode google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "❌ GOOGLE_SERVICES_JSON_BASE64 غير مضاف"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          echo "✅ google-services.json: $(wc -c < app/google-services.json) bytes"

      - name: 6. Grant execute to gradlew
        run: chmod +x gradlew

      - name: 7. Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -300

      - name: 8. List APK output
        if: always()
        run: |
          echo "=== APK files ==="
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "لا يوجد APK"
          echo ""
          echo "=== outputs tree ==="
          find app/build/outputs -type f 2>/dev/null || echo "no outputs"

      - name: 9. Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morex-father-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
